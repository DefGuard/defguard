[package]
name = "defguard_core"
version = "0.0.0"
edition.workspace = true
license-file.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
# internal crates
defguard_common = { workspace = true }
defguard_proto = { workspace = true }
defguard_web_ui = { workspace = true }
defguard_version = { workspace = true }
model_derive = { workspace = true }
defguard_certs = { workspace = true }
defguard_grpc_tls = { workspace = true }
defguard_static_ip = { workspace = true }

# mail (moved in-crate from the former defguard_mail crate)
lettre.workspace = true
pulldown-cmark.workspace = true
css-inline = "0.21"
image = "0.25" # match with qrforge
mrml = "6.0"
qrforge = { version = "0.1", default-features = false, features = ["image"] }

# external dependencies
anyhow = { workspace = true }
axum = { workspace = true }
axum-client-ip = { workspace = true }
axum-extra = { workspace = true }
axum-server = { workspace = true }
base32 = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
humantime = { workspace = true }
# match version used by sqlx
ipnetwork = { workspace = true }
jsonwebkey = { workspace = true }
jsonwebtoken = { workspace = true }
ldap3 = { workspace = true }
md4 = { workspace = true }
openidconnect.workspace = true
parse_link_header = { workspace = true }
paste = { workspace = true }
pgp = { workspace = true }
prost.workspace = true
# match version used by sqlx
rand = { workspace = true }
reqwest = { workspace = true }
rsa = { workspace = true }
rust-ini = { workspace = true }
rustls = { workspace = true }
secrecy = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true }
sha-1 = { workspace = true }
sha256 = { workspace = true }
sqlx = { workspace = true }
ssh-key = { workspace = true }
struct-patch = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tera = { workspace = true }
thiserror = { workspace = true }
# match axum-extra -> cookies
time = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
totp-lite = { workspace = true }
tower-http = { workspace = true }
tower_governor = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
trait-variant = { workspace = true }
# openapi
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid = { workspace = true }
webauthn-authenticator-rs = { workspace = true }
webauthn-rs = { workspace = true }
webauthn-rs-proto = { workspace = true }
x25519-dalek = { workspace = true }
ammonia = "4.1"
regex = "1.10"
uaparser = "0.6"
async-stream = "0.3"

[dev-dependencies]
# Enable the shared test-only helpers (mock SMTP server) for the test build.
defguard_common = { workspace = true, features = ["test-support"] }
claims.workspace = true
hyper-util = "0.1"
reqwest = { version = "0.12", features = [
    "cookies",
    "json",
    "multipart",
    "rustls-tls",
    "stream",
], default-features = false }
serde_qs = "1.0"
tower = { workspace = true }
webauthn-authenticator-rs = { version = "0.5", features = ["softpasskey"] }
wiremock = "0.6"

[build-dependencies]
tonic-prost-build.workspace = true
