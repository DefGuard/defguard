name: Create SBOM files

on:
  workflow_call:
    inputs:
      upload_url:
        description: "Release assets upload URL - used in scheduled runs. Without it, the files go to the sbom artifact."
        required: false
        type: string
      tag:
        description: "The git tag to generate SBOM for - used in scheduled runs"
        required: false
        type: string
      version:
        description: "Release version without the v prefix - used in release runs"
        required: false
        type: string

jobs:
  create-sbom:
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Determine release ref, version, and image tag
        id: vars
        # A scheduled run scans a published tag, and a release run scans the dispatched commit and its image.
        env:
          TAG_NAME: ${{ inputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$TAG_NAME" ]; then
            echo "REF=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "VERSION=${TAG_NAME#v}" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=${TAG_NAME#v}" >> $GITHUB_OUTPUT
          else
            echo "REF=$GITHUB_SHA" >> $GITHUB_OUTPUT
            echo "VERSION=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=$GITHUB_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.vars.outputs.REF }}
          submodules: recursive

      - name: Use current vulnerability policy from default branch
        if: inputs.tag != ''
        run: |
          git fetch --depth=1 origin ${{ github.event.repository.default_branch }}
          git checkout FETCH_HEAD -- .trivyignore.yaml || echo "Keeping tagged .trivyignore.yaml"

      - name: Create SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          scan-type: 'fs'
          format: 'spdx-json'
          output: "defguard-${{ steps.vars.outputs.VERSION }}.sbom.json"
          scan-ref: '.'
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln"
          skip-dirs: "e2e"

      - name: Create Docker image SBOM with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          image-ref: "ghcr.io/defguard/defguard:${{ steps.vars.outputs.IMAGE_TAG }}"
          scan-type: 'image'
          format: 'spdx-json'
          output: "defguard-${{ steps.vars.outputs.VERSION }}-docker.sbom.json"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln"

      - name: Create security advisory file with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          scan-type: 'fs'
          format: 'json'
          output: "defguard-${{ steps.vars.outputs.VERSION }}.advisories.json"
          scan-ref: '.'
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln"
          skip-dirs: "e2e"

      - name: Create docker image security advisory file with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          image-ref: "ghcr.io/defguard/defguard:${{ steps.vars.outputs.IMAGE_TAG }}"
          scan-type: 'image'
          format: 'json'
          output: "defguard-${{ steps.vars.outputs.VERSION }}-docker.advisories.json"
          severity: "CRITICAL,HIGH,MEDIUM,LOW"
          scanners: "vuln"

      - name: Upload SBOMs and advisories to the release
        if: inputs.upload_url != ''
        uses: shogo82148/actions-upload-release-asset@73f83b114970a3485e1423ecc1fb93d887c9b096 # v1.10.7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ inputs.upload_url }}
          asset_path: "defguard-*.json"
          asset_content_type: application/json
          overwrite: true

      - name: Upload SBOMs and advisories as an artifact
        if: inputs.upload_url == ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: defguard-*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
