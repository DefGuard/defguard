name: Make a new release
run-name: ${{ inputs.draft && format('Draft v{0}', inputs.version) || format('Rehearsal {0}', github.ref_name) }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix, for example 2.2.0 or 2.2.0-beta1. Leave empty for a rehearsal."
        required: false
        type: string
        default: ""
      draft:
        description: "Create the draft release. Nothing becomes public until you publish the draft."
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

# A rehearsal must not cancel a release, and a new dispatch must not cancel a running one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.draft }}
  cancel-in-progress: false

jobs:
  precheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      version: ${{ steps.gates.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Check release gates
        id: gates
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          DRAFT: ${{ inputs.draft }}
          VERSION_FILE: crates/defguard_common/Cargo.toml
        run: |
          set -euo pipefail
          FILE_VERSION=$(sed -n 's/^version = "\(.*\)"$/\1/p' "$VERSION_FILE" | head -n 1)
          VERSION=${INPUT_VERSION:-$FILE_VERSION}

          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' is not MAJOR.MINOR.PATCH with an optional -suffix"
            exit 1
          fi
          # Only the tag carries the pre-release suffix, so compare the numeric part with the file.
          if [[ ${VERSION%%-*} != "$FILE_VERSION" ]]; then
            echo "::error file=$VERSION_FILE::Version $VERSION does not match version $FILE_VERSION in $VERSION_FILE"
            exit 1
          fi

          # A rehearsal must run while its own issue is open, so these gates apply only to a draft.
          if [[ $DRAFT == true ]]; then
            if [[ -z $INPUT_VERSION ]]; then
              echo "::error::A draft needs the version input"
              exit 1
            fi

            rc=0
            git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null || rc=$?
            if [[ $rc -eq 0 ]]; then
              echo "::error::Tag v$VERSION exists. The Publish click on the draft creates the tag, so do not push it."
              exit 1
            elif [[ $rc -ne 2 ]]; then
              echo "::error::git ls-remote failed with exit code $rc"
              exit 1
            fi

            # alert-issue titles have the form "[source] branch: summary".
            BLOCKERS=$(gh issue list --label release-blocker --state open --limit 200 --json title,url \
              --jq '.[] | select(.title | contains("] " + env.GITHUB_REF_NAME + ":")) | .url')
            if [[ -n $BLOCKERS ]]; then
              echo "::error::Open release-blocker issues for $GITHUB_REF_NAME. A green rehearsal (draft=false) closes its own issue."
              echo "$BLOCKERS"
              exit 1
            fi
          fi

          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-docker:
    needs:
      - precheck
    name: Build Docker image
    uses: ./.github/workflows/build-docker.yml
    with:
      build-version: ${{ needs.precheck.outputs.version }}
      # Public tags wait for the Publish click on the draft, so this build pushes only the sha tags.
      tags: |
        type=sha
      # Explicitly disable latest tag. It will be added otherwise.
      flavor: |
        latest=false

  create-sbom:
    needs:
      - precheck
      - build-docker
    uses: ./.github/workflows/sbom.yml
    with:
      version: ${{ needs.precheck.outputs.version }}

  build-binaries:
    needs:
      - precheck
    runs-on:
      - self-hosted
      - Linux
      - X64
    timeout-minutes: 120
    env:
      VERSION: ${{ needs.precheck.outputs.version }}
      DEFGUARD_BUILD_VERSION: ${{ needs.precheck.outputs.version }}
      SQLX_OFFLINE: "1"
      # Force the installed stable toolchain. RUSTUP_TOOLCHAIN takes precedence
      # over any stale rustup directory override left on the self-hosted runner.
      RUSTUP_TOOLCHAIN: "stable"
      # sccache
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: "sccache"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml
          package_json_file: web/package.json
          run_install: false

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm build

      - name: Build source code archive
        run: tar --exclude='.github' --exclude-vcs --exclude-vcs-ignores --xform='s|^\./|defguard-${{ env.VERSION }}/|' --xz -cf ${{ runner.temp }}/defguard-${{ env.VERSION }}.tar.xz .

      - name: Upload source code archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source
          path: ${{ runner.temp }}/defguard-${{ env.VERSION }}.tar.xz
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: "aarch64-unknown-linux-gnu"

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Build Linux x86_64 binary
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          mv target/x86_64-unknown-linux-gnu/release/defguard defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu
          tar -zcf defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu.tar.gz \
            defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu

      - name: Build Linux aarch64 binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/lib/aarch64-linux-gnu
        run: |
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          mv target/aarch64-unknown-linux-gnu/release/defguard defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu
          tar -zcf defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu.tar.gz \
            defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu

      - name: Build FreeBSD binary
        run: |
          rsync -rlptxzH -e 'ssh -l root' --del ./ freebsd:work/defguard/
          ssh root@freebsd "cd work/defguard && env DEFGUARD_BUILD_VERSION='${DEFGUARD_BUILD_VERSION}' cargo build --locked --release"
          scp root@freebsd:work/defguard/target/release/defguard defguard-${{ env.VERSION }}-x86_64-unknown-freebsd
          tar -zcf defguard-${{ env.VERSION }}-x86_64-unknown-freebsd.tar.gz \
            defguard-${{ env.VERSION }}-x86_64-unknown-freebsd

      - name: Build x86_64 DEB package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu=/usr/bin/defguard
            linux/defguard.service=/usr/lib/systemd/system/defguard.service
            .env.example=/etc/defguard/core.conf"
          fpm_opts:
            "--architecture amd64
            --output-type deb
            --version ${{ env.VERSION }}
            --package defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu.deb
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build aarch64 DEB package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu=/usr/bin/defguard
            linux/defguard.service=/usr/lib/systemd/system/defguard.service
            .env.example=/etc/defguard/core.conf"
          fpm_opts:
            "--architecture arm64
            --output-type deb
            --version ${{ env.VERSION }}
            --package defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu.deb
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build x86_64 RPM package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu=/usr/bin/defguard
            linux/defguard.service=/usr/lib/systemd/system/defguard.service
            .env.example=/etc/defguard/core.conf"
          fpm_opts:
            "--architecture amd64
            --output-type rpm
            --version ${{ env.VERSION }}
            --package defguard-${{ env.VERSION }}-x86_64-unknown-linux-gnu.rpm
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build aarch64 RPM package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu=/usr/bin/defguard
            linux/defguard.service=/usr/lib/systemd/system/defguard.service
            .env.example=/etc/defguard/core.conf"
          fpm_opts:
            "--architecture arm64
            --output-type rpm
            --version ${{ env.VERSION }}
            --package defguard-${{ env.VERSION }}-aarch64-unknown-linux-gnu.rpm
            --before-install linux/preinst
            --after-install linux/postinst
            --before-remove linux/prerm
            --after-remove linux/postrm"

      - name: Build FreeBSD package
        uses: defGuard/fpm-action@ebb2575fbb892876fbdd326bb6d12524fbd7398c # main
        with:
          fpm_args:
            "defguard-${{ env.VERSION }}-x86_64-unknown-freebsd=/usr/local/bin/defguard
            freebsd/defguard=/usr/local/etc/rc.d/defguard
            .env.example=/etc/defguard/core.conf.sample"
          fpm_opts:
            "--architecture amd64
            --output-type freebsd
            --version ${{ env.VERSION }}
            --package defguard-${{ env.VERSION }}_x86_64-unknown-freebsd.pkg
            --freebsd-osversion '*'
            --depends openssl
            --after-install freebsd/post-install.sh"

      - name: Upload binaries and packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries
          path: |
            defguard-${{ env.VERSION }}-*.tar.gz
            defguard-${{ env.VERSION }}-*.deb
            defguard-${{ env.VERSION }}-*.rpm
            defguard-${{ env.VERSION }}_x86_64-unknown-freebsd.pkg
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  ubuntu-22-04-build:
    needs:
      - precheck
    runs-on:
      - self-hosted
      - Linux
      - ${{ matrix.architecture }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.precheck.outputs.version }}
      DEFGUARD_BUILD_VERSION: ${{ needs.precheck.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [ARM64, X64]
        include:
          - architecture: ARM64
            deb_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
          - architecture: X64
            deb_arch: amd64
            rust_target: x86_64-unknown-linux-gnu
    container:
      image: ubuntu:22.04
      env:
        DEBIAN_FRONTEND: noninteractive
        HOME: /root
        RUSTUP_HOME: /root/.rustup
        CARGO_HOME: /root/.cargo

    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl ca-certificates libatomic1
          git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install pnpm
        uses: pnpm/action-setup@008330803749db0355799c700092d9a85fd074e9 # v6.0.9
        with:
          package_json_file: web/package.json

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --ignore-scripts --frozen-lockfile
          pnpm build

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Install build dependencies
        run: |
          apt-get install -y build-essential pkg-config libssl-dev libudev-dev \
            protobuf-compiler libprotobuf-dev ruby ruby-dev rubygems rpm
          gem install fpm --no-document

      - name: Build binary
        run: |
          cargo build --locked --release --target ${{ matrix.rust_target }}

      - name: Build DEB package (ubuntu-22-04-lts)
        run: |
          fpm \
            --output-type deb \
            --version "${{ env.VERSION }}" \
            --architecture ${{ matrix.deb_arch }} \
            --package defguard-${{ env.VERSION }}-${{ matrix.deb_arch }}_ubuntu-22-04-lts.deb \
            --before-install linux/preinst \
            --after-install linux/postinst \
            --before-remove linux/prerm \
            --after-remove linux/postrm \
            "target/${{ matrix.rust_target }}/release/defguard=/usr/bin/defguard" \
            "linux/defguard.service=/usr/lib/systemd/system/defguard.service" \
            ".env.example=/etc/defguard/core.conf"

      - name: Upload ubuntu-22-04-lts DEB
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ubuntu-22-04-${{ matrix.deb_arch }}
          path: defguard-${{ env.VERSION }}-${{ matrix.deb_arch }}_ubuntu-22-04-lts.deb
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  assemble:
    needs:
      - precheck
      - build-docker
      - build-binaries
      - ubuntu-22-04-build
      - create-sbom
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
    env:
      VERSION: ${{ needs.precheck.outputs.version }}
      GHCR_REPO: ghcr.io/defguard/defguard
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          # docker/build-push-action adds a .dockerbuild record to the run, so download only the release artifacts.
          pattern: "{source,binaries,sbom,ubuntu-22-04-*}"
          merge-multiple: true

      - name: Record the Docker image digest
        env:
          DIGEST: ${{ needs.build-docker.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The Docker build returned no image digest: '$DIGEST'"
            exit 1
          fi
          # Later runs of the same commit move its sha tag, so the draft names this build by digest.
          echo "$GHCR_REPO@$DIGEST" > "dist/defguard-$VERSION-docker-image.txt"

      - name: Compare build output with the expected release assets
        run: |
          set -euo pipefail
          expected=(
            "defguard-$VERSION.tar.xz"
            "defguard-$VERSION-x86_64-unknown-linux-gnu.tar.gz"
            "defguard-$VERSION-aarch64-unknown-linux-gnu.tar.gz"
            "defguard-$VERSION-x86_64-unknown-freebsd.tar.gz"
            "defguard-$VERSION-x86_64-unknown-linux-gnu.deb"
            "defguard-$VERSION-aarch64-unknown-linux-gnu.deb"
            "defguard-$VERSION-x86_64-unknown-linux-gnu.rpm"
            "defguard-$VERSION-aarch64-unknown-linux-gnu.rpm"
            "defguard-${VERSION}_x86_64-unknown-freebsd.pkg"
            "defguard-$VERSION-amd64_ubuntu-22-04-lts.deb"
            "defguard-$VERSION-arm64_ubuntu-22-04-lts.deb"
            "defguard-$VERSION.sbom.json"
            "defguard-$VERSION-docker.sbom.json"
            "defguard-$VERSION.advisories.json"
            "defguard-$VERSION-docker.advisories.json"
            "defguard-$VERSION-docker-image.txt"
          )
          if ! diff <(printf '%s\n' "${expected[@]}" | sort) <(ls dist | sort); then
            echo "::error::The build output does not match the expected release assets"
            exit 1
          fi

      - name: Create or update the draft release
        if: inputs.draft
        run: |
          set -euo pipefail
          export TAG="v$VERSION"
          # The tags endpoint returns 404 for a draft, so find the draft in the release list.
          DRAFTS=$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[] | select(.draft and .tag_name == env.TAG) | .id')
          case $(wc -w <<< "$DRAFTS") in
            0)
              ARGS=(--draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
              if [[ $VERSION == *-* ]]; then ARGS+=(--prerelease); fi
              gh release create "$TAG" "${ARGS[@]}"
              ;;
            1)
              gh api --method PATCH "repos/$GH_REPO/releases/$DRAFTS" -f target_commitish="$GITHUB_SHA" > /dev/null
              ;;
            *)
              echo "::error::More than one draft release has the tag $TAG. Delete the stale drafts."
              exit 1
              ;;
          esac

      - name: Upload release assets
        if: inputs.draft
        run: |
          for attempt in 1 2 3; do
            gh release upload "v$VERSION" dist/* --clobber && exit 0
            echo "::warning::Upload attempt $attempt failed"
            sleep 30
          done
          exit 1

      - name: Close the rehearsal issue of this branch
        if: ${{ !inputs.draft }}
        run: |
          set -euo pipefail
          ISSUES=$(gh issue list --label release-blocker --state open --limit 200 --json number,title \
            --jq '.[] | select(.title | startswith("[rehearsal] " + env.GITHUB_REF_NAME + ":")) | .number')
          for issue in $ISSUES; do
            gh issue close "$issue" --comment "The rehearsal passed: $GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID"
          done

  alert:
    needs:
      - precheck
      - build-docker
      - build-binaries
      - ubuntu-22-04-build
      - create-sbom
      - assemble
    if: failure() && !inputs.draft
    uses: ./.github/workflows/alert-e2e-failure.yml
    with:
      source: rehearsal
      extra_labels: ""
      workflow: release.yml
      failure_summary: release rehearsal failed
    secrets:
      ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}
