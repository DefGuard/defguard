name: Publish OpenAPI spec to GitBook

on:
  pull_request:
    types:
      - closed
    branches:
      - release/2.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-openapi:
    if: github.event.pull_request.merged == true

    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true
      RUSTUP_TOOLCHAIN: "stable"
      GITBOOK_SPEC: defguard-2-0
      GITBOOK_ORGANIZATION: Z3mGSAbEj9iLdZ7cNFlL

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Generate openapi.json
        run: cargo run --locked -p defguard_core --example openapi

      - name: Install NodeJS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 26

      - name: Install GitBook CLI
        run: npm install -g @gitbook/cli

      - name: Publish spec to GitBook
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
        run: |
          gitbook openapi publish \
            --spec "$GITBOOK_SPEC" \
            --organization "$GITBOOK_ORGANIZATION" \
            openapi.json
