name: Publish OpenAPI spec to GitBook

on:
  push:
    branches:
      - 'release/2.1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-openapi:
    runs-on:
      - self-hosted
      - Linux
      - X64

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true
      RUSTUP_TOOLCHAIN: "stable"
      GITBOOK_SPEC: defguard-2-1
      GITBOOK_ORGANIZATION: Z3mGSAbEj9iLdZ7cNFlL

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Generate openapi.json
        run: cargo run --locked -p defguard_core --example openapi

      - name: Install NodeJS
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26

      - name: Install GitBook CLI
        run: npm install -g @gitbook/cli

      - name: Publish spec to GitBook
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
        run: |
          gitbook openapi publish \
            --spec "$GITBOOK_SPEC" \
            --organization "$GITBOOK_ORGANIZATION" \
            openapi.json
