name: Build current image
permissions:
  contents: read
  id-token: write
  packages: write
on:
  push:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-current:
    uses: ./.github/workflows/build-docker.yml
    with:
      tags: |
        type=ref,event=branch
        type=sha
      trivy-exit-code: "0"

  trigger-e2e:
    needs: build-current
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  trigger-load-tests:
    needs: build-current
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/load-test.yml
    secrets: inherit

  trigger-dev-deploy:
    needs: build-current
    if: ${{ github.event_name != 'pull_request' && (github.ref_name == 'dev' || startsWith(github.ref_name, 'release/'))}}
    uses: ./.github/workflows/dev-deployment.yml
    secrets: inherit

  trigger-staging-deploy:
    needs: build-current
    if: ${{ github.event_name != 'pull_request' && startsWith(github.ref_name, 'release/') }}
    uses: ./.github/workflows/staging-deployment.yml
    secrets: inherit

  alert-e2e-failure:
    needs: trigger-e2e
    if: failure()
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/alert-e2e-failure.yml
    secrets:
      ALERT_TOKEN: ${{ secrets.ALERT_TOKEN }}

  deploy-stable:
    needs: build-current
    if: github.event_name == 'push' && startsWith(github.ref_name, 'stable/2.')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          aws-region: eu-central-1
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
      - name: Update stable instance
        run: |
          version=${GITHUB_REF_NAME#stable/}
          name=defguard-stable-${version//./}
          id=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=$name" Name=instance-state-name,Values=running \
            --query 'Reservations[0].Instances[0].InstanceId' --output text)
          if [ "$id" = "None" ]; then
            echo "::notice::No running instance $name, skipping"
            exit 0
          fi
          cmd=$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript \
            --parameters 'commands=["cd /home/admin/defguard && docker compose pull -q && docker compose up -d"]' \
            --query Command.CommandId --output text)
          aws ssm wait command-executed --command-id "$cmd" --instance-id "$id"
