name: Continuous integration

on:
  push:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:
    branches:
      - dev
      - "release/**"
      - "stable/**"
    paths-ignore:
      - "*.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  lint:
    runs-on:
      - codebuild-defguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large

    container: public.ecr.aws/docker/library/rust:1

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: defguard-gh-build-cache
      SCCACHE_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Export workspace-relative cache paths
        run: |
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo"    >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.cargo/bin"           >> $GITHUB_PATH

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Scan code with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          scan-type: "fs"
          scan-ref: "."
          exit-code: "1"
          ignore-unfixed: true
          severity: "CRITICAL,HIGH,MEDIUM"
          scanners: "vuln"

      - name: Install protoc
        run: apt-get update && apt-get -y install libudev-dev protobuf-compiler

      - name: Check format
        run: |
          rustup component add rustfmt
          cargo fmt -- --check

      - name: Run clippy linter
        run: |
          rustup component add clippy
          cargo clippy --all-targets --all-features -- -D warnings

      # The `openapi` feature is on by default, so `--all-features` above never
      # exercises the build without it. See CONTRIBUTING.md.
      - name: Run clippy linter without default features
        run: cargo clippy --all-targets --no-default-features -- -D warnings

      - name: Install cargo-deny
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny

      - name: Run cargo deny
        run: cargo deny check --hide-inclusion-graph

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

  build:
    runs-on:
      - codebuild-defguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:2xlarge

    container: public.ecr.aws/docker/library/rust:1

    env:
      CARGO_TERM_COLOR: always
      SQLX_OFFLINE: true
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: defguard-gh-build-cache
      SCCACHE_REGION: eu-central-1
      AWS_ACCESS_KEY_ID: ${{ secrets.S3_CACHE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_CACHE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Export workspace-relative cache paths
        run: |
          echo "CARGO_HOME=$GITHUB_WORKSPACE/.cargo"    >> $GITHUB_ENV
          echo "$GITHUB_WORKSPACE/.cargo/bin"           >> $GITHUB_PATH

      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry/index
            ${{ env.CARGO_HOME }}/registry/cache
            ${{ env.CARGO_HOME }}/git/db
          key: cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-

      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install protoc
        run: apt-get update && apt-get -y install libudev-dev protobuf-compiler

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      - name: Build and archive tests
        run: |
          cargo nextest archive \
            --locked \
            --all-features \
            --archive-file nextest-archive.tar.zst \
            --config 'profile.test.debug=false' \
            --config 'profile.test.strip="debuginfo"'

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-archive
          path: nextest-archive.tar.zst
          retention-days: 1

  test:
    needs: build

    runs-on:
      - codebuild-defguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large

    container: public.ecr.aws/docker/library/rust:1

    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6, 7, 8]

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17-alpine
        env:
          POSTGRES_DB: defguard
          POSTGRES_USER: defguard
          POSTGRES_PASSWORD: defguard
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        command: postgres -c max_connections=400

    env:
      CARGO_TERM_COLOR: always
      DEFGUARD_DB_HOST: postgres
      DEFGUARD_DB_PORT: 5432
      DEFGUARD_DB_NAME: defguard
      DEFGUARD_DB_USER: defguard
      DEFGUARD_DB_PASSWORD: defguard
      DATABASE_URL: "postgresql://defguard:defguard@postgres/defguard"
      SQLX_OFFLINE: true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      - name: Install cargo-nextest
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-nextest

      - name: Run tests (shard ${{ matrix.partition }}/8)
        run: |
          cargo nextest run \
            --no-fail-fast \
            --archive-file nextest-archive.tar.zst \
            --partition hash:${{ matrix.partition }}/8

  test-ldap:
    needs: build

    runs-on:
      - codebuild-defguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - instance-size:large

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Download test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nextest-archive

      - name: Download cargo-nextest binary
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf -

      - name: Log in to ghcr.io
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Postgres and OpenLDAP
        run: docker compose -p defguard-ldap -f docker-compose.ldap-test.yaml up -d --wait db openldap

      - name: Run LDAP integration tests
        run: |
          docker run --rm \
            --network defguard-ldap_default \
            -v "$PWD:/src" -w /src \
            -v "$PWD/cargo-nextest:/usr/local/cargo/bin/cargo-nextest:ro" \
            -e CARGO_TERM_COLOR=always \
            -e SQLX_OFFLINE=true \
            -e DATABASE_URL=postgres://defguard:defguard@db:5432/defguard \
            -e LDAP_URL=ldap://openldap:1389 \
            -e LDAP_BIND_USERNAME=cn=admin,dc=example,dc=org \
            -e LDAP_BIND_PASSWORD=pass123 \
            -e LDAP_USER_SEARCH_BASE=ou=users,dc=example,dc=org \
            -e LDAP_GROUP_SEARCH_BASE=ou=groups,dc=example,dc=org \
            -e LDAP_USER_CLASS=inetOrgPerson \
            -e LDAP_GROUP_CLASS=groupOfUniqueNames \
            -e LDAP_USERNAME_ATTR=cn \
            -e LDAP_GROUPNAME_ATTR=cn \
            -e LDAP_MEMBER_ATTR=memberOf \
            -e LDAP_GROUP_MEMBER_ATTR=uniqueMember \
            public.ecr.aws/docker/library/rust:1 \
            cargo nextest run --archive-file nextest-archive.tar.zst --workspace-remap . --run-ignored only -E 'package(defguard_core) and test(/^ldap::/)'

      - name: Stop compose
        if: always()
        run: docker compose -p defguard-ldap -f docker-compose.ldap-test.yaml down -v

  cleanup:
    needs: [test, test-ldap]
    if: needs.test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Delete test archive artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'nextest-archive');
            if (artifact) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
