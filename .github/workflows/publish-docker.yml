name: Publish Docker release tags

on:
  release:
    types: [published]

jobs:
  tag-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      GHCR_REPO: ghcr.io/defguard/defguard

    permissions:
      contents: read
      packages: write
      id-token: write # needed for Cosign keyless signing

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Login to GitHub container registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Tag and sign the release image
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          # Only when the release is marked as "Latest release" in the GitHub UI
          LATEST: ${{ github.event.release.make_latest == 'true' }}
        run: |
          set -euo pipefail
          VERSION=${TAG#v}
          IMAGE=$(gh release download "$TAG" --pattern "defguard-$VERSION-docker-image.txt" --output -)
          # Release assets are editable, so the file counts only when it names a digest in GHCR_REPO.
          DIGEST=${IMAGE#"$GHCR_REPO@"}
          if [[ ! $DIGEST =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::defguard-$VERSION-docker-image.txt must hold $GHCR_REPO@sha256:<digest>, not '$IMAGE'"
            exit 1
          fi

          if [[ $PRERELEASE == true ]]; then
            TAGS=("$VERSION" pre-release)
          else
            TAGS=("$VERSION" "${VERSION%.*}")
          fi
          if [[ $LATEST == true ]]; then
            TAGS+=(latest)
          fi
          IMAGES=()
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            IMAGES+=("$GHCR_REPO:$tag")
            TAG_ARGS+=(--tag "$GHCR_REPO:$tag")
          done
          docker buildx imagetools create "${TAG_ARGS[@]}" "$GHCR_REPO@$DIGEST"
          cosign sign --yes "${IMAGES[@]}"
          cosign verify "${IMAGES[@]}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp="https://github.com/DefGuard/defguard" \
            -o text
