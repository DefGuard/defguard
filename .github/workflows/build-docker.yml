name: Build Docker image

on:
  workflow_call:
    inputs:
      tags:
        description: "List of tags as key-value pair attributes"
        required: false
        type: string
      build-version:
        description: "Optional version embedded into compiled Defguard binaries"
        required: false
        type: string
        default: ""
      flavor:
        description: "List of flavors as key-value pair attributes"
        required: false
        type: string
      trivy-exit-code:
        description: "Exit code for Trivy when vulnerabilities are found (0 = warn only, 1 = fail)"
        required: false
        type: string
        default: "1"
    outputs:
      digest:
        description: "Digest of the multi-arch manifest that this run pushed"
        value: ${{ jobs.docker-manifest.outputs.digest }}

env:
  GHCR_REPO: ghcr.io/defguard/defguard

jobs:
  build-docker:
    runs-on:
      - codebuild-defguard-core-runner-${{ github.run_id }}-${{ github.run_attempt }}
        image:${{ matrix.os }}
        instance-size:${{ matrix.size }}

    strategy:
      matrix:
        cpu: [arm64, amd64]
        include:
          - os: arm-3.0
            size: xlarge
            cpu: arm64
            tag: arm64
          - os: ubuntu-7.0
            size: xlarge
            cpu: amd64
            tag: amd64

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Login to GitHub container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sanitize branch name
        run: echo "SAFE_REF=${GITHUB_REF_NAME//\//-}" >> $GITHUB_ENV

      - name: Resolve build version
        id: build-version
        env:
          INPUT_BUILD_VERSION: ${{ inputs.build-version }}
        run: echo "value=${INPUT_BUILD_VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Build container
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: DEFGUARD_BUILD_VERSION=${{ steps.build-version.outputs.value }}
          platforms: linux/${{ matrix.cpu }}
          provenance: false
          push: true
          tags: "${{ env.GHCR_REPO }}:${{ github.sha }}-${{ matrix.tag }}"
          cache-from: |
            type=registry,ref=${{ env.GHCR_REPO }}:cache-${{ matrix.tag }}
            type=registry,ref=${{ env.GHCR_REPO }}:cache-${{ matrix.tag }}-${{ env.SAFE_REF }}
          cache-to: type=registry,mode=max,ref=${{ env.GHCR_REPO }}:cache-${{ matrix.tag }}-${{ env.SAFE_REF }}
          # The apt-get upgrade line never changes, so a cached runtime layer keeps Debian packages with fixed CVEs.
          no-cache-filters: runtime

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SHOW_SUPPRESSED: 1
          TRIVY_IGNOREFILE: "./.trivyignore.yaml"
        with:
          image-ref: "${{ env.GHCR_REPO }}:${{ github.sha }}-${{ matrix.tag }}"
          format: "table"
          exit-code: ${{ inputs.trivy-exit-code }}
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH,MEDIUM"

  docker-manifest:
    runs-on: [self-hosted, Linux]

    permissions:
      contents: read
      packages: write
      id-token: write # needed for signing the images with GitHub OIDC Token

    needs: [build-docker]

    outputs:
      digest: ${{ steps.manifest.outputs.digest }}

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_REPO }}
          flavor: ${{ inputs.flavor }}
          tags: ${{ inputs.tags }}

      - name: Login to GitHub container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push manifests
        id: manifest
        run: |
          set -o pipefail
          tags='${{ env.GHCR_REPO }}:${{ github.sha }} ${{ steps.meta.outputs.tags }}'
          for tag in ${tags}
          do
            docker manifest rm ${tag} || true
            docker manifest create ${tag} ${{ env.GHCR_REPO }}:${{ github.sha }}-amd64 ${{ env.GHCR_REPO }}:${{ github.sha }}-arm64
            # docker manifest push can print other lines before the digest, so keep only the last line.
            digest=$(docker manifest push ${tag} | tail -n 1)
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Sign the images with GitHub OIDC Token
        run: |
          images='${{ env.GHCR_REPO }}:${{ github.sha }} ${{ steps.meta.outputs.tags }}'
          cosign sign --yes ${images}

      - name: Verify image signatures
        run: |
          images='${{ env.GHCR_REPO }}:${{ github.sha }} ${{ steps.meta.outputs.tags }}'
          cosign verify ${images} --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp="https://github.com/DefGuard/defguard" -o text
